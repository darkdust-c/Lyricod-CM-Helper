name: Build

# Tests and builds the helper on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test --project tests/Lyricod-CM-Helper.Tests
      - name: Publish
        run: dotnet publish src/Lyricod-CM-Helper/Lyricod-CM-Helper.csproj -c Release -r win-x64 -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: Lyricod-CM-Helper
          path: publish/Lyricod-CM-Helper.exe
          if-no-files-found: error
          retention-days: 14
