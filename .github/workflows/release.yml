name: Release

# Run it from the Actions tab (Release > Run workflow): it builds the helper and drafts a release for the
# project's version. Publishing the draft creates its tag and makes it the release Lyricod downloads.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Read the version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/Lyricod-CM-Helper/Lyricod-CM-Helper.csproj
          $version = "$($project.Project.PropertyGroup.Version)".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "There's already a release for v$version. Raise <Version> in the project first." }
          "version=$version" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Test
        run: dotnet test --project tests/Lyricod-CM-Helper.Tests
      - name: Publish
        run: dotnet publish src/Lyricod-CM-Helper/Lyricod-CM-Helper.csproj -c Release -r win-x64 -p:DebugType=none -o publish
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          if (-not (Test-Path publish/Lyricod-CM-Helper.exe)) { throw 'Lyricod-CM-Helper.exe missing' }
          # The licences travel with the exe: its own, and those of the .NET it includes.
          Compress-Archive -Path LICENSE, THIRD-PARTY-NOTICES.md, licenses -DestinationPath publish/Lyricod-CM-Helper-licences.zip
          gh release create "v$version" publish/Lyricod-CM-Helper.exe publish/Lyricod-CM-Helper-licences.zip --target $env:GITHUB_SHA --draft --title "Lyricod CM Helper $version" --notes "Downloaded by Lyricod when you set up NetEase Cloud Music sync. See the README for what it does."
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
