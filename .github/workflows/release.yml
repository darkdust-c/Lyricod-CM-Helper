name: Release

# A tag like v1.0.0 drafts a release with the helper. Publish the draft to make it the one Lyricod downloads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check the version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/Lyricod-CM-Helper/Lyricod-CM-Helper.csproj
          $version = "$($project.Project.PropertyGroup.Version)".Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG doesn't match the project's version ($version)" }
      - name: Test
        run: dotnet test --project tests/Lyricod-CM-Helper.Tests
      - name: Publish
        run: dotnet publish src/Lyricod-CM-Helper/Lyricod-CM-Helper.csproj -c Release -r win-x64 -p:DebugType=none -o publish
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (-not (Test-Path publish/Lyricod-CM-Helper.exe)) { throw 'Lyricod-CM-Helper.exe missing' }
          gh release create $env:RELEASE_TAG publish/Lyricod-CM-Helper.exe --verify-tag --draft --title "Lyricod CM Helper $($env:RELEASE_TAG.Substring(1))" --notes "Downloaded by Lyricod when you set up NetEase Cloud Music sync. See the README for what it does."
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
